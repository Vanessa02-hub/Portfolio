   <nav class="navbar">

    title="Switch to light theme">
    ☼
</button>

    </header>

    <main class="contact-section">

        <!-- Left Panel -->
        <section class="contact-left">

            <div class="contact-overlay">

                <p class="contact-tag">// let's connect</p>

                <h1>Let's<br><span>Connect!</span></h1>

                <p class="contact-description">
                    Have a question, idea or project in mind?
                    I'd love to hear from you.
                </p>

                <div class="contact-info">

                    <p>
                        <strong>Email</strong><br>
                        <a href="mailto:vanessache2674@gmail.com">
                            vanessache2674@gmail.com
                        </a>
                    </p>

                    <p>
                        <strong>GitHub</strong><br>
                        <a href="https://github.com/Vanessa02-hub" target="_blank" rel="noopener noreferrer">
                            github.com/Vanessa02-hub
                        </a>
                    </p>

                </div>

            </div>
        </section>

        <!-- Right Panel -->
        <section class="contact-right">

            <div class="contact-card">

                <span class="form-tag">// get in touch</span>

                <h2>Contact Me</h2>

                <form id="contact-form">

                    <div class="input-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message..."
                            required></textarea>
                    </div>

                    <button type="button" onclick="sendMessage()"> Send Message</button>

                </form>

            </div>

        </section>

    </main>
